name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 测试均为离线安全设计，无需任何 API Key 即可跑通：
# - RAG / Eval 用确定性伪 Embedding 替代云端接口
# - /chat 等接口在无 Key 时降级为友好提示并返回 200
# - 路由分类 / 冒烟走本地 graph，不调模型
# 因此本流水线在公开仓库中也能稳定跑绿。

jobs:
  # 代码规范门禁：规则集固定在 pyproject.toml，不随 ruff 默认集漂移
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # 一次跑完全部用例：API 与端到端冒烟已 pytest 化，不再以脚本方式单独运行。
      # 覆盖率门槛 75%：当前实测约 82%，留约 7 个点余量应对 Python 版本差异。
      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-fail-under=75

  # 依赖锁定校验：与上面的矩阵 job 互补。
  # 矩阵验证「跨 Python 版本兼容性」（用宽松依赖），这里验证「锁定版本可安装且功能正常」，
  # 避免 requirements.lock.txt 悄悄过时或某个锁定版本装不上而无人发现。
  # 固定 3.12：锁文件按 3.12 编译，部分包（如 faiss-cpu）在 3.10 未必有对应 wheel。
  lock-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock.txt

      - name: Run tests with locked versions
        run: python -m pytest tests/test_hitl.py tests/test_api.py tests/test_rag.py -q

  # 依赖漏洞扫描（供应链安全）：只告警不阻断，避免上游一发布 CVE 公告就卡住日常开发，
  # 同时保留可追溯的扫描记录。
  # 分工：**步骤自己**吞掉 pip-audit 的非零退出并在 Job Summary 留档（所以正常会绿）；
  # 这里的 continue-on-error 只是兜底——万一「装 pip-audit」这类基础设施步骤失败，
  # 也不该阻断业务流水线。
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit locked dependencies（仅告警，不阻断）
        run: |
          # 口径：**只告警不阻断，但绝不静默**。
          #
          # 为什么不让它红：命中的修复版本全是**跨大版本**跳级，没法在一次「让 CI 变绿」的
          # 提交里升完（也不该那么做）——
          #   langchain 0.3→1.x / langgraph 0.2→1.x / langgraph-checkpoint 2.x→3~4.x /
          #   langchain-text-splitters 0.3→1.x / langchain-openai 0.3→1.x：整条 Agent 栈同时跨大版本；
          #   starlette 0.52→1.x：与 requirements.txt 里 `starlette<1.0` 的硬约束冲突
          #   （1.x 会让 FastAPI include_router 失效，业务路由全丢）；diskcache 上游暂无修复版本。
          # 处置口径与升级路径见 README §九「依赖漏洞告警的处置口径」。
          #
          # 为什么不能静默：静默等于把「已知风险」变成「无人知道的风险」。
          # 因此命中时写一条 ::warning 注释，并把完整明细写进 Job Summary（流水线页直接可查）。
          echo "## 依赖漏洞扫描（非阻断）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if pip-audit -r requirements.lock.txt >> "$GITHUB_STEP_SUMMARY" 2>&1; then
            echo "::notice title=依赖漏洞扫描::未命中已知漏洞"
          else
            echo "::warning title=依赖漏洞告警::pip-audit 命中已知漏洞（非阻断）。明细见本步骤 Job Summary；处置口径见 README §九"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
