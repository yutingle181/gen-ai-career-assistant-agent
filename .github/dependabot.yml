version: 2
# 依赖更新策略（**只开 github-actions 与 docker**）
#
# 为什么不开 pip 生态：本仓库用 pip-compile 编译锁文件（requirements*.lock.txt）。实测（2026-09-20）
# Dependabot 会按锁文件提出**违反 requirements.txt 声明约束**的升级 PR，例如：
#   · starlette 1.6.0   —— 本仓库硬约束 <1.0：1.x 会让 FastAPI 的 include_router 失效、业务路由全丢（README §九）
#   · numpy 2.5.3       —— 约束 <2：会打掉 faiss（README §九）
#   · duckduckgo-search 8.1.1 —— 约束 <8
# 这类 PR 一旦被「顺手合并」就是线上事故。因此 pip 侧维持人工流程：
#   改 requirements.txt → pip-compile 重编锁文件 → gen-lock-hashes.py 补哈希 → commit
#   → CI（lock-verify + pip-audit）→ PR 评审。
#
# github-actions 侧则由它自动盯：action 版本过期正是当初触发 Node 运行时弃用告警的原因。
# docker 生态同理：Dockerfile 里的基镜像按 digest 固定，digest 会随上游重建而更新，
# 需要它来提 PR（只动镜像 digest，不涉及依赖版本策略，不会出现 pip 生态那类越界升级）。
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
        interval: "weekly"
        day: "monday"
      labels: ["dependencies", "ci"]
      groups:
        actions-minor-patch:
          patterns: ["*"]
          update-types: ["minor", "patch"]

    - package-ecosystem: "docker"
      directory: "/"
      schedule:
        interval: "weekly"
        day: "monday"
      labels: ["dependencies", "ci"]
